# Reusable. The kit's own CI calls this, and every product can call it too so
# the deterministic gates are identical everywhere:
#   jobs:
#     checks:
#       uses: aspiralabs/aspira-kit/.github/workflows/kit-checks.yml@main
name: kit-checks
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
