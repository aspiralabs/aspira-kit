# Every pull request and every push to main: typecheck, lint, build, smoke tests.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/kit-checks.yml
    with:
      # The agents' eve build needs Node 24 (their engines); products keep kit-checks' default.
      node-version: "24"
