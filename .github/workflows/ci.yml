# Every pull request and every push to main: typecheck, lint, build, smoke tests.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/kit-checks.yml
    with:
      # The agents' eve build needs Node 24 (their engines); products keep kit-checks' default.
      node-version: "24"
      # apps/docs typechecks against @aspiralabs/ui's dist, and the kit's install test packs
      # @aspiralabs/kit from its dist; nothing else needs a build before lint, typecheck or test.
      prepare: pnpm --filter @aspiralabs/ui --filter @aspiralabs/kit build
      test-shards: "[1, 2, 3, 4, 5, 6]"
